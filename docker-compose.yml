version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live_workspace_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY:-default_production_secret_key_change_me_now}
      - JWT_SECRET=${JWT_SECRET:-default_jwt_secret_key_change_me_now}
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","https://*.pages.dev"]
    volumes:
      - ./uploads:/tmp/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: live_workspace_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
