# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Live Workspace — Enterprise SaaS Engineering Operations Platform
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # FastAPI Production Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: live-workspace-api
    runtime: python
    plan: free # Can be upgraded to 'starter', 'standard', etc.
    region: singapore # Matches Neon PostgreSQL region (aws-ap-southeast-1) for ultra-low latency
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Python Runtime Version
      - key: PYTHON_VERSION
        value: 3.11.10

      # Application Environment
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "Live Workspace SaaS API"
      - key: DEBUG
        value: "false"

      # Server Binding
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: API_V1_PREFIX
        value: /api/v1

      # Security & JWT Tokens (Auto-generated by Render if not provided)
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"

      # Storage Provider & Upload Path
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: /tmp/uploads

      # Neon PostgreSQL Database URL (Single URL — paste your Neon connection string directly)
      # Format: postgresql://<user>:<password>@<host>/<dbname>?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Allowed CORS Origins (Include your Cloudflare Pages domain and localhost for testing)
      # Example: ["https://live-workspace.pages.dev","http://localhost:5173"]
      - key: BACKEND_CORS_ORIGINS
        sync: false
